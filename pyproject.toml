[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory"
version = "0.1.0"
description = "Enterprise-grade persistent project-memory system for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Project Memory Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp==1.9.4",
    "fastembed==0.8.0",
    "scikit-learn==1.9.0",
    "numpy==2.5.3",
    "sqlite-vec==0.1.9",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
watchdog = ["watchdog>=3.0.0"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.9.10",
]

[project.entry-points]
console_scripts = { memory_cli = "memory_cli:main" }

[tool.setuptools]
py-modules = [
    "memory_cli",
    "memory_store",
    "pm_common",
    "pm_search",
    "pm_context",
    "pm_lifecycle",
    "pm_structural",
    "server",
    "wire",
    "bootstrap",
    "watcher",
    "structural_extract",
    "_test_lib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hooks*"]
exclude = [
    "test_*",
    "tests*",
    "test-js*",
    "scratch*",
    "fixtures*",
    "*.bak",
    "*.bak.*",
    "*.corrupt-*.bak",
    "memory_store_*",
    ".project-memory*",
    "venv*",
    "__pycache__*",
    ".pytest_cache*",
    "scripts*",
    "scripts/*",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.sql", "*.json", "*.txt"]
hooks = ["*.py"]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "__pycache__/*",
    ".pytest_cache/*",
    "*.bak",
    "*.bak.*",
    "*.corrupt-*.bak",
    "test_*.py",
    "test-js/*",
    "scratch/*",
    "fixtures/*",
    "memory_store_*.py",
    ".project-memory/*",
    "venv/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = [
    "test_*.py",
    "tests/*",
    "test-js/*",
    "scratch/*",
    "fixtures/*",
    "memory_store_*.py",
    ".project-memory/*",
    "venv/*",
    "__pycache__/*",
    ".pytest_cache/*",
]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    "test_*.py",
    "tests/*",
    "test-js/*",
    "scratch/*",
    "fixtures/*",
    "memory_store_*.py",
    ".project-memory/*",
    "venv/*",
    "__pycache__/*",
    ".pytest_cache/*",
    "scripts/*",
]