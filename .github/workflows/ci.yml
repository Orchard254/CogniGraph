name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # numpy==2.5.3 requires Python >=3.12, so that is the matrix floor.
          # Ubuntu: supported Python versions + Node 20 (representative)
          - os: ubuntu-latest
            python-version: "3.12"
            node-version: "20"
          - os: ubuntu-latest
            python-version: "3.13"
            node-version: "20"
          # Windows: Python 3.12 + Node 20
          - os: windows-latest
            python-version: "3.12"
            node-version: "20"
          # Additional Node versions on Ubuntu
          - os: ubuntu-latest
            python-version: "3.12"
            node-version: "18"
          - os: ubuntu-latest
            python-version: "3.12"
            node-version: "22"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache Python virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ matrix.python-version }}-

      - name: Create and activate virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv/Scripts/pip install -e ".[dev]"
          else
            venv/bin/pip install -e ".[dev]"
          fi
        shell: bash

      - name: Install Python dependencies (cache hit)
        if: steps.cache-venv.outputs.cache-hit == 'true'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv/Scripts/pip install -e ".[dev]"
          else
            venv/bin/pip install -e ".[dev]"
          fi
        shell: bash

      - name: Verify built wheel contains runtime modules and schema resources
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/cognigraph-wheel"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel_path = next((Path(__import__("os").environ["RUNNER_TEMP"]) / "cognigraph-wheel").glob("*.whl"))
          with ZipFile(wheel_path) as wheel:
              names = set(wheel.namelist())
              required = {
                  "memory_cli.py",
                  "memory_store.py",
                  "pm_backup.py",
                  "corpus_hygiene.py",
                  "branch_promotion.py",
                  "genesis_migrate.py",
                  "phase0_schema.sql",
                  "phase1_episodic.sql",
                  "phase1_episodic_embeddings.sql",
                  "phase2_branch_admin.sql",
                  "episodic_fts.sql",
                  "legacy_provenance.sql",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Wheel is missing required runtime files: {missing}")
              entry_points = next((name for name in names if name.endswith(".dist-info/entry_points.txt")), None)
              if not entry_points:
                  raise SystemExit("Wheel is missing console entry-point metadata")
              metadata = wheel.read(entry_points).decode("utf-8")
              for script in ("cognigraph = memory_cli:main", "memory_cli = memory_cli:main"):
                  if script not in metadata:
                      raise SystemExit(f"Wheel is missing console script: {script}")
          print(f"Wheel packaging smoke check passed: {wheel_path.name}")
          PY
        shell: bash

      # Watchdog is a separate optional extra (pyproject [watchdog]), NOT in
      # [dev], so without this the test_watcher.py module-level importorskip
      # skips the ENTIRE watcher module on Linux CI. Scoped to exactly one
      # Ubuntu leg (3.12/Node 20) so the real inotify observer backend gets
      # exercised on Linux; all other legs intentionally stay watchdog-free
      # (polling-fallback coverage).
      - name: Install watchdog extra (Ubuntu Py3.12/Node20 leg only)
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && matrix.node-version == '20'
        run: venv/bin/pip install -e ".[watchdog]"
        shell: bash

      - name: Lint with Ruff
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv/Scripts/ruff check . --output-format=github
          else
            venv/bin/ruff check . --output-format=github
          fi
        shell: bash

      - name: Install Node.js dependencies
        run: npm ci
        # No node_modules to install currently, but future-proof

      - name: Run Python tests with coverage
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv/Scripts/python -m pytest --cov=memory_store --cov=bootstrap --cov=watcher --cov=wire --cov=pm_common --cov=pm_search --cov=pm_context --cov=pm_lifecycle --cov=pm_structural --cov=pm_backup --cov-report=xml --cov-report=term-missing -q --ignore=scratch
          else
            venv/bin/python -m pytest --cov=memory_store --cov=bootstrap --cov=watcher --cov=wire --cov=pm_common --cov=pm_search --cov=pm_context --cov=pm_lifecycle --cov=pm_structural --cov=pm_backup --cov-report=xml --cov-report=term-missing -q --ignore=scratch
          fi
        shell: bash

      - name: Run Node.js tests
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
            # Extract and display key module coverage. Heredoc (not python -c)
            # so the script lines stay inside the YAML block scalar.
            python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for package in root.findall('.//package'):
              name = package.get('name', '')
              if any(key in name for key in ['memory_store', 'bootstrap', 'watcher', 'wire', 'pm_']):
                  classes = package.findall('classes/class')
                  for cls in classes:
                      filename = cls.get('filename', '')
                      lines = cls.findall('lines/line')
                      if lines:
                          total = len(lines)
                          covered = sum(1 for l in lines if l.get('hits', '0') != '0')
                          pct = (covered / total * 100) if total > 0 else 0
                          print(f'{filename}: {pct:.1f}% ({covered}/{total})')
          PY
          fi
        shell: bash

  docs-drift:
    name: Docs drift (README tool table)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install package
        run: |
          python -m venv venv
          venv/bin/pip install -e ".[dev]"
        shell: bash

      - name: Check README tool table is up to date
        run: |
          venv/bin/python scripts/gen_tool_table.py
          if ! git diff --exit-code README.md; then
            echo "::error::README tool table is stale — run scripts/gen_tool_table.py and commit"
            exit 1
          fi
        shell: bash

  eval-gate:
    # Merge-blocking retrieval-quality gate: fails if recall@5 or MRR on the
    # frozen golden fixture drops below the committed baseline. Ubuntu-only:
    # the eval is pure SQLite + numpy math (no OS-specific paths). Policy and
    # the fixture refresh process: eval/GATE.md
    name: Eval gate (retrieval quality)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install package
        # fastembed installs as a library only; the gate reads precomputed
        # vectors from the fixture and never downloads the embedding model.
        run: |
          python -m venv venv
          venv/bin/pip install -e ".[dev]"
        shell: bash

      - name: Run retrieval-quality gate against the frozen fixture
        run: venv/bin/python scripts/eval_gate.py
        shell: bash
